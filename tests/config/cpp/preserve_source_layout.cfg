newlines = lf
input_tab_size = 4
output_tab_size = 4
indent_columns = 4
indent_with_tabs = 2
align_with_tabs = true
preserve_source_layout = true
sp_type_func = add
sp_num_type_func = 2
sp_func_proto_paren = force
sp_func_proto_paren_empty = force
sp_func_def_paren = force
sp_func_def_paren_empty = force
sp_inside_fparens = remove
align_func_proto_span = 1
align_func_proto_gap = 2
align_func_proto_thresh = 8
nl_end_of_file = force
pp_ignore_define_body = true
set QUALIFIER ND_
set NOEXCEPT __NE___
