newlines = lf
input_tab_size = 4
output_tab_size = 4
indent_columns = 4
indent_with_tabs = 2
align_with_tabs = true
align_keep_tabs = true
align_keep_extra_space = true
preserve_source_layout = true
sp_type_func = add
sp_num_type_func = 2
sp_func_proto_paren = add
sp_func_proto_paren_empty = add
sp_func_def_paren = add
sp_func_def_paren_empty = add
sp_func_class_paren = add
sp_func_class_paren_empty = add
sp_func_call_paren = ignore
sp_func_call_paren_empty = ignore
sp_inside_fparen_decl = remove
sp_after_semi = remove
align_func_proto_span = 1
align_func_params = true
align_func_suffix_span = 4
align_func_suffix_max_column = 100
align_func_proto_gap = 2
align_func_proto_thresh = 8
nl_end_of_file = force
pp_ignore_define_body = true
set QUALIFIER ND_ __Cx__ NdCx__
set NOEXCEPT __NE___ __Th___ C_NE___ __NE_OV C_NE_OV

indent_namespace = true
indent_namespace_single_indent = false
nl_split_var_def = true
align_var_def_span = 1
align_var_def_gap = 1
sp_assign = add
